<style>
  :root { color-scheme: light; font-family: var(--maibot-font-body, system-ui, "Microsoft YaHei", sans-serif); color: var(--maibot-foreground, #18212f); }
  :root.dark { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--maibot-background, #fff); }
  .page { max-width: 1120px; margin: 0 auto; padding: 2px 0 12px; }
  .intro, .muted { color: var(--maibot-muted, #667085); font-size: .875rem; line-height: 1.6; }
  a { color: var(--maibot-primary, #3478dd); }
  .intro { margin: 0 0 18px; }
  .card { padding: 20px; margin-bottom: 16px; border: 1px solid var(--maibot-border, #d0d5dd); border-radius: var(--maibot-radius, 8px); background: var(--maibot-surface, #fff); color: var(--maibot-foreground, #18212f); }
  .card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--maibot-border, #d0d5dd); }
  h2 { margin: 0; font-size: 1rem; line-height: 1.45; }
  label { display: block; margin: 12px 0 7px; font-size: .875rem; font-weight: 600; }
  .input { display: block; width: 100%; min-width: 0; padding: 8px 12px; border: 1px solid var(--maibot-border, #d0d5dd); border-radius: var(--maibot-radius, 6px); background: var(--maibot-soft, #fff); color: var(--maibot-foreground, #18212f); font: inherit; }
  textarea.input { min-height: 94px; resize: vertical; }
  .input::placeholder { color: var(--maibot-muted, #667085); }
  :is(.input, .button, .weekday input):focus-visible { outline: 2px solid var(--maibot-primary, #3478dd); outline-offset: 2px; }
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
  .wide { grid-column: 1 / -1; }
  .hint { margin: 6px 0 0; }
  .weekdays { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 8px; }
  .weekday { display: inline-flex; align-items: center; gap: 5px; margin: 0; font-weight: 400; }
  .weekday input { accent-color: var(--maibot-primary, #3478dd); }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; }
  .button { padding: 8px 16px; border: 1px solid var(--maibot-border, #d0d5dd); border-radius: var(--maibot-radius, 6px); background: var(--maibot-background, #fff); color: var(--maibot-foreground, #18212f); font: inherit; cursor: pointer; }
  .primary { border-color: var(--maibot-primary, #3478dd); background: var(--maibot-primary, #3478dd); color: var(--maibot-primary-foreground, #fff); }
  .danger { border-color: var(--maibot-danger, #c2414d); color: var(--maibot-danger, #c2414d); }
  .button:disabled { opacity: .55; cursor: not-allowed; }
  #status { padding: 10px 12px; margin: 0 0 16px; border: 1px solid var(--maibot-border, #d0d5dd); border-radius: var(--maibot-radius, 6px); background: var(--maibot-soft, #f2f4f7); font-size: .875rem; }
  #status[data-tone="error"] { border-color: var(--maibot-danger, #c2414d); color: var(--maibot-danger, #c2414d); }
  [hidden] { display: none !important; }
  .task-list { list-style: none; margin: 0; padding: 0; }
  .task-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 15px 0; border-top: 1px solid var(--maibot-border, #d0d5dd); }
  .task-row:first-child { border-top: 0; padding-top: 0; }
  .task-info { min-width: 0; }
  .task-title { font-size: .9375rem; font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
  .task-meta { margin-top: 5px; overflow-wrap: anywhere; }
  .task-row .button { flex-shrink: 0; padding: 6px 10px; font-size: .8125rem; }
  .empty { padding: 14px 0; }
  .calendar-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .calendar-tools .input { width: auto; }
  .calendar-tools .button { padding: 7px 11px; }
  .calendar-weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .calendar-weekdays { margin-bottom: 8px; text-align: center; color: var(--maibot-muted, #667085); font-size: .8125rem; }
  .calendar-weekdays span { padding: 4px 0; }
  .calendar-day.maibot-button { min-width: 0; min-height: 82px; padding: 8px; border: 1px solid var(--maibot-border, #d0d5dd); border-radius: var(--maibot-radius, 6px); background: var(--maibot-background, #fff); color: var(--maibot-foreground, #18212f); font: inherit; text-align: left; cursor: pointer; display: block; }
  .calendar-day:hover { border-color: var(--maibot-primary, #3478dd); }
  .calendar-day[aria-pressed="true"] { border-color: var(--maibot-primary, #3478dd); box-shadow: inset 0 0 0 1px var(--maibot-primary, #3478dd); background: var(--maibot-soft, #f2f4f7); }
  .calendar-day.today .calendar-number { color: var(--maibot-primary, #3478dd); font-weight: 700; }
  .calendar-day.today[aria-pressed="true"] .calendar-number { color: var(--maibot-primary-foreground, #fff); }
  .calendar-day.past { opacity: .72; }
  .calendar-number { display: block; font-size: .875rem; font-weight: 600; }
  .calendar-count { display: block; margin-top: 9px; padding: 3px 5px; border-radius: 4px; background: var(--maibot-soft, #f2f4f7); color: var(--maibot-foreground, #18212f); font-size: .75rem; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .calendar-blank { min-height: 82px; }
  .day-detail { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--maibot-border, #d0d5dd); }
  .day-detail h3 { margin: 0 0 8px; font-size: .9375rem; }
  .day-detail ul { margin: 8px 0 0; padding-left: 20px; }
  .day-detail li { margin: 7px 0; line-height: 1.5; overflow-wrap: anywhere; }
  @media (max-width: 720px) {
    .fields { grid-template-columns: 1fr; } .task-row, .card-header { align-items: flex-start; flex-direction: column; }
    .calendar-tools { width: 100%; } .calendar-tools .input { flex: 1; min-width: 0; }
    .calendar-day.maibot-button { min-height: 58px; padding: 5px; }
    .calendar-blank { min-height: 58px; } .calendar-count { margin-top: 4px; font-size: .6875rem; }
  }
</style>
<main class="page">
  <p class="intro">这里显示普通定时任务，包括在聊天中创建的任务。单次任务提交提醒后会从列表移除；启用任务回执时，仍可在那里查看发送结果。每天和每周任务会保留。上课提醒请到<a href="/extensions/worldcopyist.mai-secretary/timetable">课表页面</a>查看。手动创建的任务会在所选聊天流中执行；下方时间按填写的时区计算。</p>
  <p id="status" role="status" aria-live="polite" hidden></p>
  <section class="card maibot-card" aria-labelledby="calendar-heading">
    <div class="card-header maibot-card-header">
      <h2 id="calendar-heading">任务日历</h2>
      <div class="calendar-tools">
        <button class="button maibot-button" id="previous-month" type="button" aria-label="上个月">‹</button>
        <select class="input maibot-select" id="calendar-year" aria-label="选择年份"></select>
        <select class="input maibot-select" id="calendar-month" aria-label="选择月份"></select>
        <button class="button maibot-button" id="next-month" type="button" aria-label="下个月">›</button>
        <button class="button maibot-button" id="today" type="button">今天</button>
      </div>
    </div>
    <p class="muted">可切换月份和年份，支持选择 2030 年及之后的日期。点击某天会选中它，并把日期填入下方的单次任务表单。日历按每项任务自己的时区标记；周期任务只显示下次执行及之后的日期。</p>
    <div class="calendar-weekdays" aria-hidden="true"><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span></div>
    <div class="calendar-grid" id="calendar-grid" role="group" aria-label="选择任务日期"></div>
    <div class="day-detail" id="day-detail" aria-live="polite"></div>
  </section>
  <section class="card maibot-card" aria-labelledby="create-heading">
    <div class="card-header maibot-card-header"><h2 id="create-heading">手动创建任务</h2></div>
    <div class="fields">
      <div class="wide"><label for="stream">发送到哪个聊天流？</label><select class="input maibot-select" id="stream"><option value="">正在读取聊天流…</option></select><p class="muted hint">只能选择麦麦已经建立的聊天流；列表为空时，先在目标聊天中发一条消息。</p></div>
      <div class="wide"><label for="instruction">到点要麦麦做什么？</label><textarea class="input maibot-input" id="instruction" maxlength="1000" placeholder="例如：告诉我今天的天气预报，并附上查询来源"></textarea></div>
      <div><label for="schedule">执行方式</label><select class="input maibot-select" id="schedule"><option value="once">仅一次</option><option value="daily">每天</option><option value="weekly">每周</option></select></div>
      <div><label for="timezone">时区</label><input class="input maibot-input" id="timezone" maxlength="80" placeholder="Asia/Shanghai" autocomplete="off"></div>
      <div id="once-field"><label for="once-at">执行日期和时间</label><input class="input maibot-input" id="once-at" type="datetime-local"></div>
      <div id="repeat-field" hidden><label for="repeat-at">每天执行时间</label><input class="input maibot-input" id="repeat-at" type="time" value="08:00"></div>
      <div id="weekdays-field" class="wide" hidden><label>星期几执行？</label><div class="weekdays" id="weekdays"></div></div>
    </div>
    <div class="actions"><button class="button primary maibot-button maibot-button-primary" id="create" type="button">创建定时任务</button></div>
  </section>
  <section class="card maibot-card" aria-labelledby="tasks-heading">
    <div class="card-header maibot-card-header"><h2 id="tasks-heading">已创建的任务</h2><button class="button maibot-button" id="refresh" type="button">刷新</button></div>
    <ul id="tasks" class="task-list"><li class="muted empty">正在读取任务…</li></ul>
  </section>
</main>
<script>
(() => {
  document.body.classList.add('maibot-page');
  const $ = id => document.getElementById(id);
  const add = (parent, tag, content, className) => { const node = document.createElement(tag); node.textContent = content; if (className) node.className = className; if (tag === 'button') { node.classList.add('maibot-button'); if (node.classList.contains('primary')) node.classList.add('maibot-button-primary'); if (node.classList.contains('danger')) node.classList.add('maibot-button-danger'); } parent.append(node); return node; };
  const showStatus = (message, error = false) => { $('status').hidden = !message; $('status').textContent = message; $('status').dataset.tone = error ? 'error' : 'info'; };
  const query = async (name, args = {}) => { const result = await maibot.query(name, args); if (result?.error) throw Error(result.error); return result; };
  const action = async (name, args = {}) => { const result = await maibot.action(name, args); if (result?.error) throw Error(result.error); return result; };
  const labels = new Map();
  const firstYear = 2020, lastYear = 2100;
  let calendarYear, calendarMonth, selectedDay = '', calendarTasks = [];
  let busy = false, moduleEnabled = true;
  function setBusy(value) { busy = value; $('create').disabled = value || !moduleEnabled; $('refresh').disabled = value; }
  const dayKey = (year, month, day) => `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  const weekday = (year, month, day) => (new Date(Date.UTC(year, month - 1, day)).getUTCDay() + 6) % 7 + 1;
  function todayInZone() {
    try {
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: $('timezone').value.trim() || 'Asia/Shanghai',
        year: 'numeric', month: '2-digit', day: '2-digit',
      }).formatToParts(new Date());
      const value = Object.fromEntries(parts.map(part => [part.type, part.value]));
      return dayKey(Number(value.year), Number(value.month), Number(value.day));
    } catch (_) {
      const now = new Date(); return dayKey(now.getFullYear(), now.getMonth() + 1, now.getDate());
    }
  }
  function occursOn(task, date, year, month, day) {
    if (task.schedule === 'once') return String(task.at || '').slice(0, 10) === date;
    if (task.status !== 'active' || date < String(task.next_run || '').slice(0, 10)) return false;
    if (task.schedule === 'daily') return true;
    return task.schedule === 'weekly' && String(task.weekdays || '').split(',').includes(String(weekday(year, month, day)));
  }
  function tasksOn(date, year, month, day) { return calendarTasks.filter(task => occursOn(task, date, year, month, day)); }
  function renderDayDetail() {
    const area = $('day-detail'); area.replaceChildren();
    if (!selectedDay) { add(area, 'p', '点击日期查看当天任务，或为当天创建单次任务。', 'muted'); return; }
    const [year, month, day] = selectedDay.split('-').map(Number);
    add(area, 'h3', `${year} 年 ${month} 月 ${day} 日`);
    const matches = tasksOn(selectedDay, year, month, day);
    if (!matches.length) add(area, 'p', '这一天没有已安排的任务。', 'muted');
    else {
      const list = document.createElement('ul');
      for (const task of matches) {
        const time = task.schedule === 'once' ? String(task.at).slice(11, 16) : task.at;
        add(list, 'li', `${time} · ${task.instruction} · ${labels.get(task.stream_id) || task.stream_id}（${task.timezone}）`);
      }
      area.append(list);
    }
    const button = add(area, 'button', '为这一天创建任务', 'button primary'); button.type = 'button';
    button.disabled = !moduleEnabled || selectedDay < todayInZone();
    button.addEventListener('click', () => {
      selectDay(selectedDay);
      $('create-heading').scrollIntoView({behavior: 'smooth', block: 'start'});
      $('once-at').focus({preventScroll: true});
    });
    if (selectedDay < todayInZone()) add(area, 'p', '这一天已过去，不能新建单次任务。', 'muted');
  }
  function renderCalendar() {
    if (!calendarYear || !calendarMonth) return;
    $('calendar-year').value = String(calendarYear);
    $('calendar-month').value = String(calendarMonth);
    $('previous-month').disabled = calendarYear === firstYear && calendarMonth === 1;
    $('next-month').disabled = calendarYear === lastYear && calendarMonth === 12;
    const grid = $('calendar-grid'); grid.replaceChildren();
    const offset = weekday(calendarYear, calendarMonth, 1) - 1;
    for (let index = 0; index < offset; index++) add(grid, 'span', '', 'calendar-blank');
    const total = new Date(Date.UTC(calendarYear, calendarMonth, 0)).getUTCDate();
    const today = todayInZone();
    for (let day = 1; day <= total; day++) {
      const date = dayKey(calendarYear, calendarMonth, day);
      const matches = tasksOn(date, calendarYear, calendarMonth, day);
      const button = document.createElement('button'); button.type = 'button';
      button.className = `calendar-day maibot-button${date === today ? ' today' : ''}${date < today ? ' past' : ''}`;
      button.setAttribute('aria-pressed', String(date === selectedDay));
      button.setAttribute('aria-label', `${calendarYear}年${calendarMonth}月${day}日，${matches.length}项任务`);
      add(button, 'span', String(day), 'calendar-number');
      if (matches.length) add(button, 'span', `${matches.length} 项 · ${matches[0].instruction}`, 'calendar-count');
      button.addEventListener('click', () => selectDay(date)); grid.append(button);
    }
    renderDayDetail();
  }
  function selectDay(date) {
    selectedDay = date;
    if (date >= todayInZone()) {
      const time = $('once-at').value.split('T')[1] || '08:00';
      $('schedule').value = 'once'; updateSchedule();
      $('once-at').value = `${date}T${time}`;
      showStatus(`已选择 ${date}，请在下方填写时间、聊天流和任务内容。`);
    } else showStatus(`已选择 ${date}。过去的日期只能查看任务。`);
    renderCalendar();
  }
  function moveMonth(delta) {
    const next = new Date(Date.UTC(calendarYear, calendarMonth - 1 + delta, 1));
    const year = next.getUTCFullYear();
    if (year < firstYear || year > lastYear) return;
    calendarYear = year; calendarMonth = next.getUTCMonth() + 1;
    selectedDay = ''; renderCalendar();
  }
  for (let year = firstYear; year <= lastYear; year++) {
    const option = document.createElement('option'); option.value = String(year); option.textContent = `${year} 年`; $('calendar-year').append(option);
  }
  for (let month = 1; month <= 12; month++) {
    const option = document.createElement('option'); option.value = String(month); option.textContent = `${month} 月`; $('calendar-month').append(option);
  }
  $('previous-month').addEventListener('click', () => moveMonth(-1));
  $('next-month').addEventListener('click', () => moveMonth(1));
  $('calendar-year').addEventListener('change', () => { calendarYear = Number($('calendar-year').value); selectedDay = ''; renderCalendar(); });
  $('calendar-month').addEventListener('change', () => { calendarMonth = Number($('calendar-month').value); selectedDay = ''; renderCalendar(); });
  $('today').addEventListener('click', () => {
    const date = todayInZone(); [calendarYear, calendarMonth] = date.split('-').map(Number); selectDay(date);
  });
  $('timezone').addEventListener('change', renderCalendar);
  function updateSchedule() {
    const once = $('schedule').value === 'once';
    $('once-field').hidden = !once;
    $('repeat-field').hidden = once;
    $('weekdays-field').hidden = $('schedule').value !== 'weekly';
  }
  for (const [day, name] of ['一','二','三','四','五','六','日'].entries()) {
    const label = document.createElement('label'); label.className = 'weekday';
    const box = document.createElement('input'); box.type = 'checkbox'; box.value = String(day + 1);
    label.append(box, document.createTextNode('周' + name)); $('weekdays').append(label);
  }
  $('schedule').addEventListener('change', updateSchedule);
  function renderStreams(streams) {
    const selected = $('stream').value;
    labels.clear(); $('stream').replaceChildren();
    const placeholder = document.createElement('option'); placeholder.value = '';
    placeholder.textContent = streams.length ? '请选择聊天流' : '暂无可选聊天流'; $('stream').append(placeholder);
    for (const stream of streams) {
      labels.set(stream.stream_id, stream.label);
      const option = document.createElement('option'); option.value = stream.stream_id; option.textContent = stream.label; $('stream').append(option);
    }
    if (labels.has(selected)) $('stream').value = selected;
  }
  function renderTasks(tasks) {
    const list = $('tasks'); list.replaceChildren();
    if (!tasks.length) { add(list, 'li', '还没有定时任务', 'muted empty'); return; }
    const statusName = {active:'等待执行', completed:'已触发（未确认消息发出）', missed:'已错过', failed:'触发失败'};
    const scheduleName = {once:'单次', daily:'每天', weekly:'每周'};
    for (const task of tasks) {
      const row = document.createElement('li'); row.className = 'task-row';
      const info = document.createElement('div'); info.className = 'task-info';
      add(info, 'div', task.instruction, 'task-title');
      const when = task.schedule === 'weekly' ? `周 ${task.weekdays} ${task.at}` : task.schedule === 'daily' ? `每天 ${task.at}` : task.at;
      add(info, 'div', `${statusName[task.status] || task.status} · ${scheduleName[task.schedule] || task.schedule} · ${when} · ${task.timezone}`, 'muted task-meta');
      add(info, 'div', `聊天流：${labels.get(task.stream_id) || task.stream_id} · ${task.status === 'active' ? '下次执行' : '原计划时间'}：${task.next_run}`, 'muted task-meta');
      if (task.last_error) add(info, 'div', `最近错误：${task.last_error}`, 'muted task-meta');
      add(info, 'div', `任务编号：${task.id} · 来源：${task.owner_user_id === '__secretary_webui__' ? '插件页面' : '聊天用户 '+task.owner_user_id}`, 'muted task-meta');
      const button = add(row, 'button', task.status === 'active' ? '取消任务' : '删除记录', 'button danger'); button.type = 'button';
      button.addEventListener('click', async () => {
        if (!window.confirm(window.secretaryTranslate('确定取消这项定时任务吗？'))) return;
        if (busy) return;
        try { setBusy(true); await action('cancel', {task_id: task.id}); await refresh(); showStatus('任务已取消'); }
        catch (error) { showStatus(String(error), true); } finally { setBusy(false); }
      });
      row.prepend(info); list.append(row);
    }
  }
  async function refresh() {
    const data = await query('list');
    $('timezone').value ||= data.timezone || 'Asia/Shanghai';
    moduleEnabled = Boolean(data.enabled);
    $('create').disabled = busy || !moduleEnabled;
    try { renderStreams((await query('streams')).streams || []); }
    catch (error) { renderStreams([]); showStatus('聊天流读取失败：' + String(error), true); }
    calendarTasks = data.tasks || [];
    renderTasks(calendarTasks);
    if (!calendarYear) {
      const today = todayInZone();
      [calendarYear, calendarMonth] = today.split('-').map(Number);
      selectedDay = today;
    }
    renderCalendar();
    if (!moduleEnabled) showStatus('定时任务模块当前已关闭。已有任务仍会显示，开启后才可创建和执行。', true);
  }
  $('refresh').addEventListener('click', async () => {
    try { setBusy(true); await refresh(); showStatus('任务列表已刷新'); }
    catch (error) { showStatus(String(error), true); } finally { setBusy(false); }
  });
  $('create').addEventListener('click', async () => {
    if (busy) return;
    const schedule = $('schedule').value;
    const weekdays = [...$('weekdays').querySelectorAll('input:checked')].map(item => item.value).join(',');
    const args = {
      stream_id: $('stream').value, instruction: $('instruction').value.trim(), schedule,
      at: (schedule === 'once' ? $('once-at').value : $('repeat-at').value),
      timezone: $('timezone').value.trim(), weekdays: schedule === 'weekly' ? weekdays : '',
    };
    if (!args.stream_id || !args.instruction || !args.at || (schedule === 'weekly' && !args.weekdays)) {
      showStatus('请填写聊天流、任务内容、执行时间；每周任务还要选择星期。', true); return;
    }
    try {
      setBusy(true); const result = await action('create', args);
      await refresh(); showStatus(result.content || '定时任务已创建'); $('instruction').value = '';
    } catch (error) { showStatus(String(error), true); } finally { setBusy(false); }
  });
  maibot.ready.then(() => refresh().catch(error => showStatus(String(error), true)));
})();
</script>

  const originals = new WeakMap();
  const attributes = new WeakMap();
  let language = 'zh';

  function translate(value) {
    if (language === 'zh') return value;
    const catalog = catalogs[language];
    const trimmed = value.trim();
    if (catalog[trimmed]) return value.replace(trimmed, catalog[trimmed]);
    const weekdays = {
      en: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'],
      ja: ['月曜日', '火曜日', '水曜日', '木曜日', '金曜日', '土曜日', '日曜日'],
      ko: ['월요일', '화요일', '수요일', '목요일', '금요일', '토요일', '일요일'],
    }[language];
    const longDate = trimmed.match(/^(\d{4}) 年 (\d{1,2}) 月 (\d{1,2}) 日$/);
    if (longDate) {
      const date = new Date(Date.UTC(+longDate[1], +longDate[2] - 1, +longDate[3]));
      return new Intl.DateTimeFormat(language, { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' }).format(date);
    }
    const dateLabel = trimmed.match(/^(\d{4})年(\d{1,2})月(\d{1,2})日，(\d+)项任务$/);
    if (dateLabel) {
      const date = new Date(Date.UTC(+dateLabel[1], +dateLabel[2] - 1, +dateLabel[3]));
      const label = new Intl.DateTimeFormat(language, { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' }).format(date);
      return `${label}, ${dateLabel[4]} ${catalog['项任务']}`;
    }
    let translated = value;
    translated = translated.replace(/^周 ([1-7]) (\d{2}:\d{2})$/, (_, day, time) => `${weekdays[+day - 1]} ${time}`);
    translated = translated.replace(/^周([1-7]) 第(\d+)–(\d+)节/, (_, day, first, last) => {
      if (language === 'en') return `${weekdays[+day - 1]}, periods ${first}–${last}`;
      if (language === 'ja') return `${weekdays[+day - 1]}・${first}～${last}限`;
      return `${weekdays[+day - 1]} ${first}~${last}교시`;
    });
    translated = translated.replace(/第([\d、]+)周/g, (_, weeks) => {
      if (language === 'en') return `weeks ${weeks.replaceAll('、', ', ')}`;
      if (language === 'ja') return `第${weeks}週`;
      return `제${weeks.replaceAll('、', ', ')}주`;
    });
    translated = translated.replace(/第 (\d+) 周/g, (_, week) => {
      if (language === 'en') return `week ${week}`;
      if (language === 'ja') return `第${week}週`;
      return `제${week}주`;
    });
    translated = translated.replace(/第 (\d+)–(\d+) 节(?!开始时间)/g, (_, first, last) => {
      if (language === 'en') return `periods ${first}–${last}`;
      if (language === 'ja') return `第${first}～${last}限`;
      return `제${first}~${last}교시`;
    });
    const status = {
      en: { active: 'Active', sent: 'Sent', send_failed: 'Send failed', unknown: 'Unknown', familiar: 'Familiar', stranger: 'Stranger' },
      ja: { active: '有効', sent: '送信済み', send_failed: '送信失敗', unknown: '不明', familiar: '知人', stranger: '初対面' },
      ko: { active: '활성', sent: '전송됨', send_failed: '전송 실패', unknown: '알 수 없음', familiar: '지인', stranger: '낯선 사람' },
    }[language];
    translated = translated.replace(/^(active|sent|send_failed|unknown)(?= · )/, match => status[match]);
    translated = translated.replace(/(?<= · )(familiar|stranger)$/, match => status[match]);
    for (const source of fragments) {
      if (translated.includes(source)) translated = translated.replaceAll(source, catalog[source]);
    }
    return translated;
  }

  function updateText(node) {
    if (node.parentElement?.closest('script,style')) return;
    const current = node.nodeValue || '';
    let item = originals.get(node);
    if (!item || current !== item.rendered) item = { source: current, rendered: current };
    const rendered = translate(item.source);
    item.rendered = rendered;
    originals.set(node, item);
    if (current !== rendered) node.nodeValue = rendered;
  }

  function updateAttributes(element) {
    let saved = attributes.get(element);
    if (!saved) saved = {};
    for (const name of ['placeholder', 'aria-label', 'title']) {
      if (!element.hasAttribute(name)) continue;
      const current = element.getAttribute(name) || '';
      let item = saved[name];
      if (!item || current !== item.rendered) item = { source: current, rendered: current };
      const rendered = translate(item.source);
      item.rendered = rendered;
      saved[name] = item;
      if (current !== rendered) element.setAttribute(name, rendered);
    }
    attributes.set(element, saved);
  }

  function scan(root) {
    if (root.nodeType === Node.TEXT_NODE) return updateText(root);
    if (root.nodeType !== Node.ELEMENT_NODE || root.matches('script,style')) return;
    updateAttributes(root);
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      if (walker.currentNode.nodeType === Node.TEXT_NODE) updateText(walker.currentNode);
      else if (!walker.currentNode.matches('script,style')) updateAttributes(walker.currentNode);
    }
  }

  function setLanguage(value) {
    const next = String(value || 'zh').toLowerCase().split('-')[0];
    language = Object.hasOwn(catalogs, next) ? next : 'zh';
    scan(document.body);
  }

  window.secretaryTranslate = translate;

  const observer = new MutationObserver(records => {
    for (const record of records) {
      if (record.type === 'characterData') updateText(record.target);
      else if (record.type === 'attributes') updateAttributes(record.target);
      else for (const node of record.addedNodes) scan(node);
    }
  });
  observer.observe(document.body, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['placeholder', 'aria-label', 'title'] });
  scan(document.body);
  maibot.ready.then(() => setLanguage(maibot.context.language));
  window.addEventListener('maibot:context', event => setLanguage(event.detail.language));
})();

</script>
