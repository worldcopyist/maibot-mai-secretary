<style>
  :root {
    color-scheme: light;
    font-family: var(--maibot-font-body, system-ui, "Microsoft YaHei", sans-serif);
    color: var(--maibot-foreground, #18212f);
  }
  :root.dark { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--maibot-background, #fff); }
  .knowledge-page { max-width: 1120px; margin: 0 auto; padding: 2px 0 12px; }
  .maibot-card { padding: 20px; border: 1px solid var(--maibot-border, #d0d5dd); border-radius: var(--maibot-radius, 8px); background: var(--maibot-surface, #fff); color: var(--maibot-foreground, #18212f); }
  .maibot-card-header { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--maibot-border, #d0d5dd); font-weight: 600; }
  .maibot-button { padding: 8px 16px; border: 1px solid var(--maibot-border, #d0d5dd); border-radius: var(--maibot-radius, 6px); background: var(--maibot-background, #fff); color: var(--maibot-foreground, #18212f); cursor: pointer; }
  .maibot-button-primary { border-color: var(--maibot-primary, #3478dd); background: var(--maibot-primary, #3478dd); color: var(--maibot-primary-foreground, #fff); }
  .maibot-button-danger { border-color: var(--maibot-danger, #c2414d); background: var(--maibot-danger, #c2414d); color: #fff; }
  .maibot-input { padding: 8px 12px; border: 1px solid var(--maibot-border, #d0d5dd); border-radius: var(--maibot-radius, 6px); background: var(--maibot-soft, #fff); color: var(--maibot-foreground, #18212f); font: inherit; }
  .maibot-input::placeholder { color: var(--maibot-muted, #667085); }
  :is(.maibot-button, .maibot-input):focus-visible { outline: 2px solid var(--maibot-primary, #3478dd); outline-offset: 2px; }
  .intro { margin: 0 0 18px; color: var(--maibot-muted, #667085); font-size: .875rem; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
  .kb-card { min-width: 0; margin: 0 0 16px; }
  .grid .kb-card { margin: 0; }
  .kb-card h2 { margin: 0; font-size: 1rem; line-height: 1.45; }
  .kb-card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .kb-card p { margin: 0 0 14px; }
  .muted { color: var(--maibot-muted, #667085); font-size: .875rem; line-height: 1.55; }
  label { display: block; margin: 13px 0 7px; font-size: .875rem; font-weight: 600; }
  .maibot-input { display: block; width: 100%; min-width: 0; }
  textarea.maibot-input { min-height: 128px; resize: vertical; }
  input[type="file"].maibot-input { min-height: 40px; height: auto; }
  input[type="file"]::file-selector-button { margin-right: 12px; padding: 4px 10px; border: 1px solid var(--maibot-border, #d0d5dd); border-radius: var(--maibot-radius, 6px); background: var(--maibot-soft, #f2f4f7); color: var(--maibot-foreground, #18212f); font: inherit; cursor: pointer; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }
  .maibot-button { font: inherit; white-space: nowrap; }
  #progress { display: block; width: 100%; height: 6px; margin-top: 14px; accent-color: var(--maibot-primary, #3478dd); }
  [hidden] { display: none !important; }
  #status { margin: 0 0 16px; padding: 10px 12px; border: 1px solid var(--maibot-border, #d0d5dd); border-radius: var(--maibot-radius, 6px); background: var(--maibot-soft, #f2f4f7); font-size: .875rem; line-height: 1.5; }
  #status[data-tone="error"] { border-color: var(--maibot-danger, #c2414d); color: var(--maibot-danger, #c2414d); }
  .doc-list { list-style: none; margin: 0; padding: 0; }
  .doc-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--maibot-border, #d0d5dd); }
  .doc-row:first-child { border-top: 0; padding-top: 0; }
  .doc-info { min-width: 0; }
  .doc-name { font-size: .9rem; font-weight: 600; overflow-wrap: anywhere; }
  .doc-meta { margin-top: 5px; overflow-wrap: anywhere; }
  .doc-actions { display: flex; flex-wrap: wrap; gap: 8px; flex-shrink: 0; }
  .doc-actions .maibot-button { padding: 6px 10px; font-size: .8125rem; }
  .empty { padding: 14px 0; }
  .search-form { display: flex; align-items: end; gap: 10px; }
  .search-form label { margin-top: 0; }
  .search-field { flex: 1; min-width: 0; }
  .results article { padding: 13px 0; border-top: 1px solid var(--maibot-border, #d0d5dd); }
  .results article:first-child { margin-top: 16px; }
  .results p { margin: 7px 0 0; white-space: pre-wrap; line-height: 1.6; overflow-wrap: anywhere; }
  .results small { color: var(--maibot-muted, #667085); }
  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
    .doc-row { align-items: flex-start; flex-direction: column; }
    .search-form { align-items: stretch; flex-direction: column; }
    .search-form .maibot-button { align-self: flex-start; }
  }
</style>
<main class="maibot-page knowledge-page">
  <p class="intro">资料保存在小秘书的知识库中。只有插件设置里授权的聊天流能让麦麦查询；允许列表为空时，聊天中无法读取资料。</p>
  <div class="grid">
    <section class="maibot-card kb-card" aria-labelledby="upload-heading">
      <div class="maibot-card-header"><h2 id="upload-heading">上传文档</h2></div>
      <p class="muted">支持 PDF、DOCX、XLSX、PPTX、TXT、Markdown、HTML、CSV、JSON、RTF、EPUB、ODT/ODS/ODP 等。单文件最大 8 MiB；扫描版 PDF 需先做文字识别。</p>
      <label for="file">选择文件</label>
      <input class="maibot-input" id="file" type="file" accept=".pdf,.docx,.xlsx,.pptx,.txt,.md,.markdown,.html,.htm,.csv,.tsv,.json,.jsonl,.xml,.yaml,.yml,.log,.rst,.tex,.rtf,.epub,.odt,.ods,.odp">
      <div class="actions"><button class="maibot-button maibot-button-primary" id="upload" type="button">上传并建立索引</button></div>
      <progress id="progress" value="0" max="100" aria-label="上传进度" hidden></progress>
    </section>
    <section class="maibot-card kb-card" aria-labelledby="paste-heading">
      <div class="maibot-card-header"><h2 id="paste-heading">粘贴文本</h2></div>
      <label for="title">标题</label><input class="maibot-input" id="title" maxlength="100" placeholder="例如：项目使用说明">
      <label for="content">正文</label><textarea class="maibot-input" id="content" maxlength="45000" placeholder="在这里粘贴要让麦麦查阅的内容"></textarea>
      <div class="actions"><button class="maibot-button maibot-button-primary" id="paste" type="button">保存并建立索引</button></div>
    </section>
  </div>
  <p id="status" role="status" aria-live="polite" hidden></p>
  <section class="maibot-card kb-card" aria-labelledby="documents-heading">
    <div class="maibot-card-header kb-card-header"><h2 id="documents-heading">已上传资料</h2><button class="maibot-button" id="refresh" type="button">刷新状态</button></div>
    <ul class="doc-list" id="documents"><li class="muted empty">正在读取资料…</li></ul>
  </section>
  <section class="maibot-card kb-card" aria-labelledby="search-heading">
    <div class="maibot-card-header"><h2 id="search-heading">测试检索</h2></div>
    <div class="search-form"><div class="search-field"><label for="query">想查什么？</label><input class="maibot-input" id="query" maxlength="500" placeholder="输入关键词或自然语言问题"></div><button class="maibot-button" id="search" type="button">检索</button></div>
    <div id="results" class="results" aria-live="polite"></div>
  </section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const status = (message, error = false) => { $('status').hidden = !message; $('status').textContent = message; $('status').dataset.tone = error ? 'error' : 'info'; };
  const busy = value => { for (const id of ['upload','paste','refresh','search']) $(id).disabled = value; };
  const add = (parent, tag, text, className) => { const node = document.createElement(tag); node.textContent = text; if (className) node.className = className; parent.append(node); return node; };
  const query = async (name, args={}) => { const result = await maibot.query(name,args); if (result?.error) throw Error(result.error); return result; };
  const action = async (name, args={}) => { const result = await maibot.action(name,args); if (result?.error) throw Error(result.error); return result; };
  async function refresh() {
    const data = await query('list');
    const list = $('documents'); list.replaceChildren();
    if (!data.documents.length) add(list, 'li', '还没有文档', 'muted empty');
    for (const doc of data.documents) {
      const row = document.createElement('li'); row.className = 'doc-row'; const info = document.createElement('div'); info.className = 'doc-info';
      add(info, 'div', doc.name, 'doc-name');
      const state = {queued:'等待建索引',indexing:'正在建索引',ready:'可检索',failed:'失败'}[doc.status] || doc.status;
      add(info, 'div', `${state} · ${doc.chunk_count} 段 · ${(doc.size/1024).toFixed(1)} KiB${doc.error ? ' · '+doc.error : ''}`, 'muted doc-meta');
      row.append(info); const actions = document.createElement('div'); actions.className = 'doc-actions';
      const rebuild = add(actions, 'button', '重建', 'maibot-button'); rebuild.type = 'button';
      rebuild.addEventListener('click', async () => { try { busy(true); await action('rebuild', {document_id:doc.id}); status('正在重建 '+doc.name); await refresh(); } catch (e) {status(String(e),true);} finally {busy(false);} });
      const button = add(actions, 'button', '删除', 'maibot-button maibot-button-danger'); button.type = 'button'; row.append(actions);
      button.addEventListener('click', async () => { try { busy(true); await action('delete', {document_id:doc.id}); status('已删除 '+doc.name); await refresh(); } catch (e) {status(String(e),true);} finally {busy(false);} });
      list.append(row);
    }
  }
  async function run(work) { try {busy(true); await work();} catch (error) {status(String(error),true);} finally {busy(false); $('progress').hidden = true;} }
  $('upload').addEventListener('click', () => run(async () => {
    const file = $('file').files[0]; if (!file) throw Error('请先选文件');
    if (!file.size || file.size > 8*1024*1024) throw Error('文件须小于 8 MiB');
    const {upload_id} = await action('start',{filename:file.name,size:file.size});
    $('progress').hidden = false; $('progress').value = 0;
    const step = 36*1024; let sequence = 0;
    for (let offset=0; offset<file.size; offset+=step) {
      const bytes = new Uint8Array(await file.slice(offset,offset+step).arrayBuffer());
      let binary = ''; for (const byte of bytes) binary += String.fromCharCode(byte);
      await action('append',{upload_id,sequence:sequence++,data:btoa(binary)});
      $('progress').value = Math.round(Math.min(1,(offset+bytes.length)/file.size)*100);
      status(`正在上传：${Math.min(offset+bytes.length,file.size)} / ${file.size} 字节`);
    }
    const result = await action('finish',{upload_id});
    status(result.duplicate ? '相同内容已存在' : '已接收文档，正在后台建立索引；请刷新状态');
    $('file').value = ''; $('progress').hidden = true; await refresh();
  }));
  $('paste').addEventListener('click', () => run(async () => {
    const title = $('title').value.trim(), content = $('content').value.trim();
    if (!title || !content) throw Error('请填写标题和正文');
    const result = await action('add_text',{title,content});
    status(result.duplicate ? '相同内容已存在' : '已保存文本，正在后台建立索引');
    $('content').value = ''; await refresh();
  }));
  $('refresh').addEventListener('click', () => run(async () => {await refresh(); status('状态已刷新');}));
  $('search').addEventListener('click', () => run(async () => {
    const terms = $('query').value.trim(); if (!terms) throw Error('请输入检索词');
    const data = await query('search',{query:terms});
    const results = $('results'); results.replaceChildren();
    if (!data.results.length) add(results,'p','没有找到相关内容');
    for (const hit of data.results) { const card = document.createElement('article'); add(card,'small',`${hit.source} · 第 ${hit.chunk} 段`); add(card,'p',hit.text); results.append(card); }
    status(`找到 ${data.results.length} 个相关片段`);
  }));
  maibot.ready.then(() => refresh().catch(e => status(String(e),true)));
})();
</script>
