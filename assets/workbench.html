<style>
  :root { color-scheme: light; font-family: var(--maibot-font-body, system-ui, "Microsoft YaHei", sans-serif); color: var(--maibot-foreground, #18212f); }
  :root.dark { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--maibot-background, #fff); }
  main { max-width: 1120px; margin: auto; padding: 2px 0 20px; }
  .intro, .muted { color: var(--maibot-muted, #667085); font-size: .875rem; line-height: 1.6; }
  .card { padding: 20px; margin: 0 0 16px; border: 1px solid var(--maibot-border, #d0d5dd); border-radius: var(--maibot-radius, 8px); background: var(--maibot-surface, #fff); }
  h2 { margin: 0 0 14px; font-size: 1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(245px, 1fr)); gap: 12px; }
  .item { border: 1px solid var(--maibot-border, #d0d5dd); border-radius: var(--maibot-radius, 6px); padding: 12px; min-width: 0; overflow-wrap: anywhere; }
  .item strong { display: block; margin-bottom: 5px; }
  .item p { margin: 5px 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  button, input, select { font: inherit; }
  button { cursor: pointer; padding: 7px 11px; border: 1px solid var(--maibot-border, #d0d5dd); border-radius: var(--maibot-radius, 6px); background: var(--maibot-background, #fff); color: var(--maibot-foreground, #18212f); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--maibot-primary, #3478dd); outline-offset: 2px; }
  .primary { background: var(--maibot-primary, #3478dd); color: var(--maibot-primary-foreground, #fff); border-color: var(--maibot-primary, #3478dd); }
  .danger { color: var(--maibot-danger, #c2414d); border-color: var(--maibot-danger, #c2414d); }
  input, select { padding: 7px 10px; border: 1px solid var(--maibot-border, #d0d5dd); border-radius: var(--maibot-radius, 6px); background: var(--maibot-background, #fff); color: var(--maibot-foreground, #18212f); }
  input[type=number] { width: 110px; }
  .form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .form label { font-size: .875rem; }
  #status { padding: 10px 12px; margin: 0 0 16px; background: var(--maibot-soft, #f2f4f7); border: 1px solid var(--maibot-border, #d0d5dd); border-radius: var(--maibot-radius, 6px); }
  #status[data-error=true] { color: var(--maibot-danger, #c2414d); }
  [hidden] { display: none !important; }
</style>
<main>
  <p class="intro">这里显示当前实际生效的模块状态。聊天中由管理员设定的开关会保存到小秘书状态文件，并覆盖配置页原值；“恢复配置”可撤销这层覆盖。MaiBot 管理页若整体关闭插件，聊天开关无法重新加载它。</p>
  <p id="status" role="status" aria-live="polite" hidden></p>
  <section class="card maibot-card"><h2>功能开关</h2><div id="switches" class="grid"></div></section>
  <section class="card maibot-card"><h2>关系管理</h2><div class="form"><label for="account">QQ 账号</label><input class="maibot-input" id="account" placeholder="qq:123456789" maxlength="50"><select class="maibot-select" id="level" aria-label="关系级别"><option value="familiar">熟人</option><option value="stranger">陌生人</option><option value="reset">恢复自动判断</option></select><button class="primary maibot-button maibot-button-primary" id="save-relationship">保存关系</button></div><div id="relationships" class="grid"></div></section>
  <section class="card maibot-card"><h2>约定回访</h2><p class="muted">用户可以在聊天中用自然语言创建、查询、取消个人回访，或退出个人回访。页面可取消已安排的事项。</p><div id="followups" class="grid"></div></section>
  <section class="card maibot-card"><h2>定时任务回执</h2><p class="muted">“已入队”只是主程序接受任务；“确认发送”才有实际发送回执。“未知”不会自动重发。仅明确发送失败可手动重试一次。</p><div id="receipts" class="grid"></div></section>
  <div class="actions"><button class="maibot-button" id="refresh">刷新状态</button></div>
</main>
<script>
(() => {
  document.body.classList.add('maibot-page');
  const $ = id => document.getElementById(id);
  const add = (parent, tag, value, className) => { const node = document.createElement(tag); node.textContent = String(value ?? ''); if (className) node.className = className; if (tag === 'button') node.classList.add('maibot-button'); parent.append(node); return node; };
  const status = (value, error=false) => { $('status').hidden = !value; $('status').textContent = value; $('status').dataset.error = String(error); };
  const call = async (name, args={}) => { const result = await maibot.action(name, args); if (result?.error || result?.success === false) throw Error(result.error || result.content || '操作失败'); return result; };
  const run = async task => { try { status('正在保存…'); await task(); await refresh(); status('已保存'); } catch (error) { status(String(error.message || error), true); } };
  const empty = (parent, value) => add(parent, 'p', value, 'muted');
  async function refresh() {
    const data = await maibot.query('status');
    if (data?.error) throw Error(data.error);
    const switches = $('switches'); switches.replaceChildren();
    for (const row of data.switches || []) {
      const box = add(switches, 'div', '', 'item'); add(box, 'strong', row.label);
      add(box, 'p', `开关：${row.enabled ? '开启' : '关闭'} · 当前生效：${row.effective ? '是' : '否'} · 配置页：${row.configured ? '开启' : '关闭'}${row.chat_override ? ' · 聊天设置覆盖中' : ''}`, 'muted');
      const actions = add(box, 'div', '', 'actions');
      for (const [action, label] of [['enable','开启'], ['disable','关闭'], ['reset','恢复配置']]) {
        const button = add(actions, 'button', label); button.type = 'button';
        button.addEventListener('click', () => run(() => call('feature_set', {action, feature: row.key})));
      }
    }
    const relations = $('relationships'); relations.replaceChildren();
    if (!data.relationships?.length) empty(relations, '暂时没有记录的关系。');
    for (const row of data.relationships || []) {
      const box = add(relations, 'div', '', 'item'); add(box, 'strong', `${row.account} · ${row.level}`);
      add(box, 'p', `互动 ${row.interactions} 次${row.manual_override ? ' · 管理员手动指定' : ''}`, 'muted');
    }
    const followups = $('followups'); followups.replaceChildren();
    if (!data.followups?.length) empty(followups, '暂无回访。');
    for (const row of [...(data.followups || [])].reverse()) {
      const box = add(followups, 'div', '', 'item'); add(box, 'strong', row.topic);
      add(box, 'p', `${row.owner_account} · ${row.stream_id} · ${row.status} · ${new Date(row.due_at * 1000).toLocaleString()}`, 'muted');
      if (row.status === 'active') { const button = add(box, 'button', '取消'); button.addEventListener('click', () => { if (window.confirm(window.secretaryTranslate('确定取消这项回访吗？'))) run(() => call('followup_cancel', {followup_id: row.id})); }); }
    }
    const receipts = $('receipts'); receipts.replaceChildren();
    if (!data.receipts?.length) empty(receipts, '暂无任务回执。');
    for (const row of data.receipts || []) {
      const box = add(receipts, 'div', '', 'item'); add(box, 'strong', `${row.status} · ${row.instruction}`);
      add(box, 'p', `回执 ${row.id} · ${row.stream_id} · ${new Date(row.accepted_at * 1000).toLocaleString()}`, 'muted');
      if (row.error) add(box, 'p', row.error, 'muted');
      if (row.status === 'send_failed' && !row.retry_of) { const button = add(box, 'button', '重试一次'); button.addEventListener('click', () => { if (window.confirm(window.secretaryTranslate('确定重试这项已经确认发送失败的任务吗？'))) run(() => call('receipt_retry', {receipt_id: row.id})); }); }
    }
  }
  $('save-relationship').addEventListener('click', () => run(() => call('relationship_set', {action: $('level').value, account: $('account').value.trim()})));
  $('refresh').addEventListener('click', () => refresh().catch(error => status(String(error.message || error), true)));
  refresh().catch(error => status(String(error.message || error), true));
})();
</script>

    });
    translated = translated.replace(/第([\d、]+)周/g, (_, weeks) => {
      if (language === 'en') return `weeks ${weeks.replaceAll('、', ', ')}`;
      if (language === 'ja') return `第${weeks}週`;
      return `제${weeks.replaceAll('、', ', ')}주`;
    });
    translated = translated.replace(/第 (\d+) 周/g, (_, week) => {
      if (language === 'en') return `week ${week}`;
      if (language === 'ja') return `第${week}週`;
      return `제${week}주`;
    });
    translated = translated.replace(/第 (\d+)–(\d+) 节(?!开始时间)/g, (_, first, last) => {
      if (language === 'en') return `periods ${first}–${last}`;
      if (language === 'ja') return `第${first}～${last}限`;
      return `제${first}~${last}교시`;
    });
    const status = {
      en: { active: 'Active', sent: 'Sent', send_failed: 'Send failed', unknown: 'Unknown', familiar: 'Familiar', stranger: 'Stranger' },
      ja: { active: '有効', sent: '送信済み', send_failed: '送信失敗', unknown: '不明', familiar: '知人', stranger: '初対面' },
      ko: { active: '활성', sent: '전송됨', send_failed: '전송 실패', unknown: '알 수 없음', familiar: '지인', stranger: '낯선 사람' },
    }[language];
    translated = translated.replace(/^(active|sent|send_failed|unknown)(?= · )/, match => status[match]);
    translated = translated.replace(/(?<= · )(familiar|stranger)$/, match => status[match]);
    for (const source of fragments) {
      if (translated.includes(source)) translated = translated.replaceAll(source, catalog[source]);
    }
    return translated;
  }

  function updateText(node) {
    if (node.parentElement?.closest('script,style')) return;
    const current = node.nodeValue || '';
    let item = originals.get(node);
    if (!item || current !== item.rendered) item = { source: current, rendered: current };
    const rendered = translate(item.source);
    item.rendered = rendered;
    originals.set(node, item);
    if (current !== rendered) node.nodeValue = rendered;
  }

  function updateAttributes(element) {
    let saved = attributes.get(element);
    if (!saved) saved = {};
    for (const name of ['placeholder', 'aria-label', 'title']) {
      if (!element.hasAttribute(name)) continue;
      const current = element.getAttribute(name) || '';
      let item = saved[name];
      if (!item || current !== item.rendered) item = { source: current, rendered: current };
      const rendered = translate(item.source);
      item.rendered = rendered;
      saved[name] = item;
      if (current !== rendered) element.setAttribute(name, rendered);
    }
    attributes.set(element, saved);
  }

  function scan(root) {
    if (root.nodeType === Node.TEXT_NODE) return updateText(root);
    if (root.nodeType !== Node.ELEMENT_NODE || root.matches('script,style')) return;
    updateAttributes(root);
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      if (walker.currentNode.nodeType === Node.TEXT_NODE) updateText(walker.currentNode);
      else if (!walker.currentNode.matches('script,style')) updateAttributes(walker.currentNode);
    }
  }

  function setLanguage(value) {
    const next = String(value || 'zh').toLowerCase().split('-')[0];
    language = Object.hasOwn(catalogs, next) ? next : 'zh';
    scan(document.body);
  }

  window.secretaryTranslate = translate;

  const observer = new MutationObserver(records => {
    for (const record of records) {
      if (record.type === 'characterData') updateText(record.target);
      else if (record.type === 'attributes') updateAttributes(record.target);
      else for (const node of record.addedNodes) scan(node);
    }
  });
  observer.observe(document.body, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['placeholder', 'aria-label', 'title'] });
  scan(document.body);
  maibot.ready.then(() => setLanguage(maibot.context.language));
  window.addEventListener('maibot:context', event => setLanguage(event.detail.language));
})();

</script>
<!-- secretary-i18n:end -->
