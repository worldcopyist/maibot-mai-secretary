试做小饼干，等烤箱里飘出香味。
'''
dusk_choices = '''
看看晚霞，给自己准备晚饭。
出门散一小会儿步，顺路买晚饭食材。
做一份热乎的晚饭，吃完收拾餐具。
在窗边吹吹傍晚的风，再回屋吃晚饭。
'''
night_choices = '''
裹着毯子看动漫，想起一段喜欢的剧情。
追一集电视剧，边看边吃点小零食。
玩一会儿休闲游戏，和喜欢的角色一起冒险。
在桌边拼一会儿乐高，慢慢搭出喜欢的造型。
做一点拼豆手工，试着搭配几种颜色。
抱着抱枕看电影，喝一杯热饮。
'''
late_night_choices = '''
关掉游戏和屏幕，洗漱、整理小窝，准备 00:00 睡觉。
收好拼豆和积木，洗漱上床，00:00 准时睡觉。
听一点轻音乐、整理床铺，00:00 熄灯睡觉。
'''
predawn_choices = "00:00–07:00 安稳睡觉，早上 07:00 再起床。"

