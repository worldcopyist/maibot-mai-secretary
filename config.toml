monday_afternoon = "窝在家里涂涂画画，给蓝莓和粉色小鱼画可爱的小涂鸦。"
monday_dusk = "看看窗外的晚霞，准备简单的晚饭，吃完收拾餐具。"
monday_night = "裹着毯子看轻松的动画或玩一会儿休闲游戏。"
monday_late_night = "放下屏幕，洗漱、整理小窝，23:50 上床，00:00 睡觉。"
