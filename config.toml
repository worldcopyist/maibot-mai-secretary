[plugin]
config_version = "0.1.0"
enabled = true
timezone = "Asia/Shanghai"
check_interval_seconds = 30
misfire_grace_seconds = 600
max_tasks_per_user = 30
admin_accounts = []

[scheduled_tasks]
enabled = true

[task_receipts]
enabled = true
wait_minutes = 15

[relationships]
enabled = true

[followups]
enabled = false
auto_capture = false
max_active_per_user = 10

[blueberry_budget]
enabled = false
low_balance_threshold = 10.0
alert_cooldown_hours = 24

[message_debounce]
enabled = true
debounce_seconds = 2.0
max_wait_seconds = 8.0
suppress_stale_private_replies = true
merge_separator = "\n"
enable_private = true
enable_group = true
ignore_commands = true
command_prefixes = ["/", "!", "！"]

[poke]
enabled = true
respond_to_poke = true
received_action_description = "戳一戳"
reaction_probability = 0.85
back_poke_probability = 0.6
reply_after_back_poke_probability = 0.3
bystander_enabled = true
bystander_probability = 0.35
bystander_target = "victim"
allow_model_poke = true
group_enabled = true
private_enabled = true
reaction_mode = "auto"
reaction_cooldown_seconds = 12
max_reactions_per_minute = 6
poke_cooldown_seconds = 60
max_pokes_per_hour = 6
adapter_plugin_id = ""

[group_admin]
enabled = false
managed_group_ids = []
welcome_enabled = false
welcome_template = "欢迎 {name} 来到群里！"
review_mode = "manual"
review_accept_words = []
review_reject_words = []
review_reject_reason = "申请信息不符合本群要求"
moderation_enabled = false
moderation_recall = true
moderation_mute = true
moderation_mute_minutes = 10
moderation_sensitivity = 50
adapter_plugin_id = ""

[voice_synthesis]
enabled = true
voice_prompt = "请生成适合不同角色和日常内容的自然普通话声线。音色清晰、亲和、稳定，不要预设特定年龄、性别或人物身份。语速适中，字句连贯，按语义和标点自然停顿，重音服务于表达，不逐字强调。根据文本调整语气：闲聊轻松，说明清楚，严肃内容克制；避免机械播报、固定卖萌或夸张表演。只朗读提供的文本，不添加称呼、口头禅或额外台词。"
max_text_chars = 600
cooldown_seconds = 30
timeout_seconds = 90.0
singing_enabled = true
singing_voice = "冰糖"

[daily_report]
enabled = false
manual_enabled = true
manual_cooldown_minutes = 10
theme = "azure"
text_model = ""
fallback_text_model = ""
target_chats = []
summary_time = "21:00"

[proactive]
enabled = true
target_chats = []
window_start = "09:00"
window_end = "21:00"
messages_per_window = 1
scheduling_mode = "count"
average_interval_hours = 2.0
offset_minutes = 15
intent = "请根据这个聊天流的最近对话、人物关系和已有记忆，找一个贴合上下文的话题，在当前聊天流发出一条自然的消息。避免复述最近说过的话；上下文较少时可聊轻松的日常话题。不要提及插件或定时器。"

[anti_bullying]
enabled = true
forbidden_words = []
confidence_threshold = 0.8
alert_cooldown_minutes = 10

[knowledge_base]
enabled = true
allowed_chats = []
chunk_chars = 800
overlap_chars = 120
semantic_search = true

[deepseek_web]
enabled = false
search_enabled = true
balance_enabled = true
api_key = ""
balance_alias = ""
auto_balance_enabled = false
auto_balance_interval_hours = 6.0
balance_context_all_chats = false
base_url = "https://api.deepseek.com"
timeout_seconds = 20.0
default_count = 4
max_count = 10
search_content_chars = 2000
search_output_chars = 8000
cache_ttl_seconds = 600
search_qps = 5.0
fetch_content_chars = 8000
fetch_qps = 5.0

[virtual_life]
enabled = false
fixed_slots = "wednesday_afternoon,thursday_afternoon,friday_dusk"

# 每行一个候选活动；只在对应时段随机选择。下面的每周字段仅在 fixed_slots 指定时生效。
morning_choices = '''
07:00 起床洗漱，烤吐司和煎蛋当早餐。
起床后开窗透气，做一碗酸奶水果当早餐。
洗漱后煮点热粥，慢慢吃早餐、听早晨的音乐。
起床叠被子，泡一杯热饮，配面包吃早餐。
'''
late_morning_choices = '''
给窗边植物浇水，顺手整理小窝。
整理照片相册，挑出几张喜欢的照片。
坐在桌边拼乐高，琢磨下一块积木放哪里。
拿出拼豆板，慢慢拼一幅小图案。
听歌并收拾书架和零食架。
看一集轻松的动漫，边看边记住喜欢的情节。
'''
noon_choices = '''
做一碗鸡蛋面当午饭，吃完休息片刻。
煮米饭配一份家常菜，慢慢吃午饭。
准备简单的午餐，饭后在沙发上小憩。
吃完热乎的午饭，洗好餐具再晒晒太阳。
'''
afternoon_choices = '''
玩一会儿喜欢的游戏，刚好碰上有趣的关卡。
在桌边拼乐高，试着搭一座小房子。
挑几种颜色做拼豆，等图案一点点成形。
窝在沙发上看动漫，猜下一集会发生什么。
追一集电视剧，记住今天最有趣的剧情。
画画或做小手工，桌上摆满彩笔和材料。
